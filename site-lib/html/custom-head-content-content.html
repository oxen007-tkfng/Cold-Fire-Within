<style>
html,
body,
.theme-light,
.theme-dark {
  background: #171613 !important;
  color: #e5dbc4 !important;
}

body,
.markdown-rendered,
.markdown-preview-view,
.markdown-reading-view,
.markdown-source-view {
  font-size: 21px !important;
  line-height: 1.65 !important;
}

.markdown-rendered h1,
.markdown-rendered h2,
.markdown-rendered h3 {
  font-family: Georgia, "Times New Roman", serif !important;
  color: #d8b271 !important;
}

.markdown-rendered a {
  color: #d2a45f !important;
}

.markdown-rendered {
  max-width: 1100px !important;
}
</style>

<script>
(function () {
  function shortenPublishedLinks() {
    document.querySelectorAll("a").forEach(function (link) {
      const label = link.textContent.trim();

      if (!label.includes("/") && !label.includes("\\")) {
        return;
      }

      const parts = label.split(/[\/\\]/);
      let filename = parts[parts.length - 1].trim();

      filename = filename.replace(/\.html?$/i, "");

      if (filename) {
        link.textContent = filename;
      }
    });
  }

  function start() {
    shortenPublishedLinks();

    const observer = new MutationObserver(function () {
      shortenPublishedLinks();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });

    setTimeout(shortenPublishedLinks, 250);
    setTimeout(shortenPublishedLinks, 1000);
    setTimeout(shortenPublishedLinks, 2500);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
